<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Global News24 | IPMA GO</title>
  <meta http-equiv="refresh" content="0;url=https://news24.ai.kr/">
  <style>
    *{box-sizing:border-box} body{margin:0;min-height:100vh;display:grid;place-items:center;background:#08111d;color:#fff;font-family:Arial,'Noto Sans KR',sans-serif}
    .card{width:min(92vw,520px);padding:30px;border:1px solid #8b743d;border-radius:18px;background:#101b2a;text-align:center}
    .eyebrow{color:#d9b95e;font-size:12px;font-weight:800;letter-spacing:.12em} h1{font-size:26px;margin:12px 0} p{color:#aeb8c5;line-height:1.7}
    a{display:inline-block;margin-top:12px;padding:12px 18px;border-radius:999px;background:#d9b95e;color:#07111d;text-decoration:none;font-weight:900}
    small{display:block;margin-top:18px;color:#6f7d8d}
  </style>
</head>
<body>
  <main class="card">
    <div class="eyebrow">IPMA GO · STABLE LINK v1.0.0</div>
    <h1>Global News24</h1>
    <p>공식 페이지로 이동하고 있습니다.</p>
    <a id="fallback" href="https://news24.ai.kr/">바로 이동</a>
    <small>/go/news24/</small>
  </main>
  <script>
  (function(){
    var target='https://news24.ai.kr/';
    try {
      var q=window.location.search||'';
      var h=window.location.hash||'';
      if(q) target += (target.indexOf('?')>=0?'&':'?') + q.slice(1);
      if(h) target += h;
      document.getElementById('fallback').href=target;
      window.location.replace(target);
    } catch(e) {
      window.location.href=target;
    }
  })();
  </script>
</body>
</html>
