<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IPMA 결제 승인</title><style>body{margin:0;background:#07111f;color:#eef4ff;font-family:Arial,'Noto Sans KR',sans-serif}.wrap{max-width:640px;margin:0 auto;padding:70px 18px;text-align:center}.card{background:#101c2c;border:1px solid #2b3b52;border-radius:18px;padding:28px}.ok{font-size:48px}.btn{display:inline-block;margin-top:18px;padding:14px 20px;border-radius:12px;background:#208c4a;color:#fff;text-decoration:none;font-weight:900}.err{color:#ff9c9c}.muted{color:#afbdd3;line-height:1.6}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><div class="wrap"><div class="card"><div id="icon" class="ok">⏳</div><h2 id="title">결제를 승인하고 있습니다</h2><p id="msg" class="muted">토스 결제 인증 결과를 서버에서 확인한 뒤 열람권한을 자동으로 생성합니다.</p><a id="go" class="btn" href="./" style="display:none">영상 바로 보기</a></div></div><script>
const db=supabase.createClient('https://ojxarsfaewehwjidwgac.supabase.co','sb_publishable_ZoAZrV5rDmYDLxhXlnEXCw_lPqJfin0');
(async()=>{const q=new URLSearchParams(location.search);const paymentKey=q.get('paymentKey'),orderId=q.get('orderId'),amount=Number(q.get('amount')),contentCode=q.get('content')||'IPMA-MUX-SMA3-1';const title=document.getElementById('title'),msg=document.getElementById('msg'),icon=document.getElementById('icon'),go=document.getElementById('go');
 try{const {data:{session}}=await db.auth.getSession();if(!session)throw new Error('로그인이 만료되었습니다. 다시 로그인 후 시도해 주세요.');if(!paymentKey||!orderId||amount!==1000)throw new Error('결제 정보가 올바르지 않습니다.');
 const {data,error}=await db.functions.invoke('ipma-toss-confirm',{body:{paymentKey,orderId,amount,contentCode}});if(error)throw error;if(!data?.ok)throw new Error(data?.message||'결제 승인에 실패했습니다.');
 icon.textContent='✓';title.textContent='테스트 결제 승인 완료';msg.textContent='Supabase 구매권한이 자동 생성되었습니다. 영상교육관으로 돌아가면 바로 시청할 수 있습니다.';go.style.display='inline-block';setTimeout(()=>location.href='./',1800);
 }catch(e){icon.textContent='!';title.textContent='결제 승인 확인 필요';title.className='err';msg.textContent=e?.message||String(e);go.textContent='영상교육관으로 돌아가기';go.style.display='inline-block';}})();
</script></body></html>
