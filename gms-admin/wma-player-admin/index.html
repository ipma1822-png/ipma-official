<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>WMA PLAYER ADMIN</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;background:#07172b;color:#eef4ff;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}.wrap{width:min(1200px,calc(100% - 24px));margin:auto;padding:28px 0}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.gold{color:#f2c867}.panel{background:#0c213f;border:1px solid #ffffff20;border-radius:18px;padding:18px;margin-top:18px}.tools{display:flex;gap:8px;flex-wrap:wrap}.tools input,.tools select{min-height:42px;background:#06152b;color:#fff;border:1px solid #ffffff25;border-radius:10px;padding:8px}.stats{font-size:32px;font-weight:900}.list{display:grid;gap:8px}.row{display:grid;grid-template-columns:1.1fr 1.3fr 1fr 1fr .9fr auto;gap:8px;align-items:center;padding:12px;border:1px solid #ffffff18;border-radius:12px;background:#ffffff07}.row small{display:block;color:#9fb0c8}.badge{padding:5px 8px;border-radius:999px;background:#ffffff12}.row button,.detail button{border:0;border-radius:9px;padding:8px 10px;font-weight:800;cursor:pointer}.detail{display:none}.detail pre{white-space:pre-wrap;word-break:break-word;background:#06152b;padding:14px;border-radius:12px}.statusBtns{display:flex;gap:8px;flex-wrap:wrap}.msg{color:#f2c867}@media(max-width:800px){.row{grid-template-columns:1fr 1fr}.row>*:last-child{grid-column:1/-1}}</style></head><body><main class="wrap"><div class="top"><div><div class="gold">WMA CHAMPIONSHIP 2026</div><h1>PLAYER ENTRY ADMIN</h1></div><a href="../" style="color:#fff">GMS ADMIN</a></div><section id="gate" class="panel">GMS 관리자 세션을 확인하는 중입니다…</section><section id="app" style="display:none"><div class="panel"><div class="stats"><span id="count">0</span> ENTRIES</div><div class="tools"><input id="q" placeholder="이름 · 번호 · 국가 · 소속"><select id="status"><option value="">전체 상태</option><option>RECEIVED</option><option>CONFIRMED</option><option>CANCELLED</option></select><select id="category"><option value="">전체 종목</option><option value="TAEKWONKUMDO">태권검도</option><option value="SELF_DEFENSE">호신술</option><option value="MARTIAL_ARTS_FORMS">무도 품새</option><option value="CREATIVE_MARTIAL_ARTS">창작무도</option></select></div></div><section class="panel"><div id="list" class="list"></div></section><section id="detail" class="panel detail"><h2>참가자 상세</h2><pre id="detailText"></pre><div class="statusBtns"><button onclick="setStatus('RECEIVED')">RECEIVED</button><button onclick="setStatus('CONFIRMED')">CONFIRMED</button><button onclick="setStatus('CANCELLED')">CANCELLED</button></div><p id="msg" class="msg"></p></section></section></main><script>const U='https://ojxarsfaewehwjidwgac.supabase.co',K='sb_publishable_ZoAZrV5rDmYDLxhXlnEXCw_lPqJfin0',db=supabase.createClient(U,K,{auth:{persistSession:true,autoRefreshToken:true}}),$=id=>document.getElementById(id);let rows=[],selected=null;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function init(){const {data:{session}}=await db.auth.getSession();if(!session){$('gate').innerHTML='GMS 로그인 세션이 없습니다. <a style="color:#f2c867" href="../">GMS 관리자로 이동</a>';return}const {data:ctx,error}=await db.rpc('gms_get_my_admin_context');if(error||!ctx?.is_admin){$('gate').textContent='WMA 관리자 권한이 없습니다.';return}$('gate').style.display='none';$('app').style.display='block';await load()}async function load(){const {data,error}=await db.rpc('wma_admin_list_player_entries');if(error){$('list').textContent='조회 실패: '+error.message;return}rows=data||[];$('count').textContent=rows.length;render()}function render(){const q=$('q').value.trim().toLowerCase(),st=$('status').value,cat=$('category').value;const x=rows.filter(r=>(!q||[r.entry_number,r.player_name,r.country_name,r.organization_name,r.arena_number].some(v=>String(v||'').toLowerCase().includes(q)))&&(!st||r.status===st)&&(!cat||r.event_category===cat));$('list').innerHTML=x.length?x.map(r=>`<article class="row"><div><b>${esc(r.entry_number)}</b><small>${new Date(r.created_at).toLocaleString()}</small></div><div><b>${esc(r.player_name)}</b><small>${esc(r.organization_name||'—')}</small></div><div>${esc(r.country_name)}<small>${esc(r.arena_number||'GENERAL')}</small></div><div>${esc(r.event_category)}</div><div><span class="badge">${esc(r.status)}</span></div><button onclick="openDetail('${r.id}')">상세</button></article>`).join(''):'신청자가 없습니다.'}async function openDetail(id){const {data,error}=await db.rpc('wma_admin_get_player_entry',{p_id:id});if(error)return alert(error.message);selected=id;$('detailText').textContent=JSON.stringify(data,null,2);$('detail').style.display='block';$('detail').scrollIntoView({behavior:'smooth'})}async function setStatus(s){if(!selected)return;const {error}=await db.rpc('wma_admin_set_player_entry_status',{p_id:selected,p_status:s});$('msg').textContent=error?'변경 실패: '+error.message:'상태 변경 완료: '+s;if(!error)await load()}$('q').oninput=render;$('status').onchange=render;$('category').onchange=render;window.openDetail=openDetail;window.setStatus=setStatus;init();</script></body></html>
