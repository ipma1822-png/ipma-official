<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WTKF 승단관리</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
*{box-sizing:border-box}body{margin:0;background:#080808;color:#eee;font-family:Arial,"Noto Sans KR",sans-serif}.wrap{max-width:1180px;margin:auto;padding:28px 18px}h1{margin:0 0 5px;color:#d6b35b}.sub{color:#999;margin-bottom:24px}.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}.bar input,.bar select,textarea{background:#111;border:1px solid #333;color:#eee;border-radius:8px;padding:10px}.bar input{flex:1;min-width:220px}.card{background:#101010;border:1px solid #2c2617;border-radius:14px;padding:18px;margin:12px 0}.top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.name{font-size:20px;font-weight:700}.no{color:#999;font-size:13px}.badge{padding:6px 10px;border:1px solid #7b642a;border-radius:999px;color:#e4c46e}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0}.grid div{background:#0a0a0a;padding:10px;border-radius:8px}.grid b{display:block;color:#888;font-size:12px;margin-bottom:5px}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{border:1px solid #5c4a20;background:#17130b;color:#e8cc80;padding:9px 12px;border-radius:8px;cursor:pointer}.actions button:hover{background:#2a2110}.note{width:100%;margin-top:10px;min-height:58px}.login{padding:28px;border:1px solid #332b19;border-radius:14px;text-align:center}.muted{color:#888}@media(max-width:760px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:480px){.grid{grid-template-columns:1fr}}
</style></head><body><div class="wrap"><h1>WTKF 승단·인준 관리자</h1><div class="sub">GMS ONE LOGIN · ADMIN CENTER · v0.2.0 · SAME ORIGIN</div><div id="login" class="login">GMS 관리자 로그인 상태를 확인하고 있습니다…</div><main id="app" hidden><div class="bar"><input id="q" placeholder="성명 · 접수번호 검색"><select id="filter"><option value="">전체 상태</option><option>접수완료</option><option>입금확인</option><option>심사중</option><option>승인</option><option>보류</option><option>반려</option><option>ICA등록완료</option></select><button onclick="load()">새로고침</button></div><div id="list"></div></main></div><script>
const URL='https://ojxarsfaewehwjidwgac.supabase.co',KEY='sb_publishable_ZoAZrV5rDmYDLxhXlnEXCw_lPqJfin0';
const sb=supabase.createClient(URL,KEY);let rows=[];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function init(){const {data:{session}}=await sb.auth.getSession();if(!session){document.getElementById('login').innerHTML='<b>GMS 관리자 로그인이 필요합니다.</b><br><span class="muted">기존 GMS 관리자 로그인 후 이 화면을 다시 열어주세요. <br><a href="/gms-admin/" style="color:#e4c46e">GMS 관리자로 이동</a></span>';return}const {data:ctx}=await sb.rpc('gms_get_my_admin_context');if(!ctx?.is_admin){document.getElementById('login').textContent='WTKF 관리자 권한이 없습니다.';return}document.getElementById('login').hidden=true;document.getElementById('app').hidden=false;load()}
async function load(){const {data,error}=await sb.rpc('wtkf_admin_list_applications');if(error){document.getElementById('list').textContent='불러오기 실패: '+error.message;return}rows=data||[];render()}
function render(){let q=document.getElementById('q').value.trim().toLowerCase(),f=document.getElementById('filter').value;let a=rows.filter(x=>(!f||x.status===f)&&(!q||x.name.toLowerCase().includes(q)||x.application_no.toLowerCase().includes(q)));document.getElementById('list').innerHTML=a.length?a.map(x=>`<section class="card"><div class="top"><div><div class="name">${esc(x.name)} · ${x.target_dan}단</div><div class="no">${esc(x.application_no)} · ${new Date(x.created_at).toLocaleString('ko-KR')}</div></div><span class="badge">${esc(x.status)}</span></div><div class="grid"><div><b>신청구분</b>${esc(x.application_type)}</div><div><b>현재단</b>${x.current_dan??'없음'}</div><div><b>심사·등록비</b>${Number(x.fee).toLocaleString()}원</div><div><b>연락처</b>${esc(x.phone||'-')}</div><div><b>생년월일</b>${esc(x.birthdate)}</div><div><b>이메일</b>${esc(x.email||'-')}</div><div><b>단증번호</b>${esc(x.credential_no||'-')}</div><div><b>발급일</b>${esc(x.credential_issued_at||'-')}</div></div><div class="actions">${['입금확인','심사중','승인','보류','반려','ICA등록완료'].map(s=>`<button onclick="setStatus('${x.application_no}','${s}')">${s}</button>`).join('')}</div><textarea class="note" id="n-${x.application_no}" placeholder="관리자 메모">${esc(x.admin_note||'')}</textarea></section>`).join(''):'<div class="muted">조건에 맞는 신청이 없습니다.</div>'}
async function setStatus(no,status){if(!confirm(no+' → '+status+' 처리할까요?'))return;const note=document.getElementById('n-'+no)?.value||null;const {error}=await sb.rpc('wtkf_admin_set_application_status',{p_application_no:no,p_status:status,p_admin_note:note,p_credential_no:null,p_credential_issued_at:null});if(error){alert('처리 실패: '+error.message);return}await load()}
document.getElementById('q').addEventListener('input',render);document.getElementById('filter').addEventListener('change',render);init();
</script></body></html>
