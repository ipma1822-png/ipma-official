<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>회원가입 | 국제경찰무도연합회 IPMA</title>
<meta name="description" content="국제경찰무도연합회(IPMA) 회원가입 신청">
<style>
:root{--bg:#0b1220;--panel:#111b2f;--ink:#eef3ff;--muted:#aab6d0;--gold:#d8b15a;--line:rgba(255,255,255,.12)}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;background:radial-gradient(circle at 20% 0,#162a4a 0,transparent 35%),var(--bg);color:var(--ink);line-height:1.6}
a{color:inherit;text-decoration:none}.wrap{width:min(1040px,calc(100% - 32px));margin:auto;padding:24px 0 70px}
.top{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:16px 0}.brand b{display:block;font-size:18px}.brand span{font-size:12px;color:var(--muted)}.home{border:1px solid var(--line);padding:9px 13px;border-radius:12px}
.hero,.box{background:rgba(17,27,47,.92);border:1px solid var(--line);border-radius:22px;box-shadow:0 18px 50px rgba(0,0,0,.25)}.hero{padding:28px;margin:10px 0 20px}.hero small{color:var(--gold);font-weight:800}.hero h1{margin:6px 0 8px}.hero p{margin:0;color:var(--muted)}
form{display:grid;gap:18px}.box{padding:24px}.box h2{margin:0 0 16px;font-size:19px;color:var(--gold)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{display:grid;gap:7px;font-weight:700}label.full{grid-column:1/-1}input,select,textarea{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:11px;background:#0d1729;color:#fff;font:inherit}textarea{min-height:105px;resize:vertical}option{color:#111}.note{font-size:12px;color:var(--muted);font-weight:400}.consent{display:flex;gap:10px;align-items:flex-start;font-weight:500}.consent input{width:auto;margin-top:6px}button{border:0;border-radius:12px;padding:14px 22px;background:linear-gradient(135deg,#d8b15a,#9b7426);color:#fff;font-weight:900;font-size:16px;cursor:pointer}.choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.choice{position:relative}.choice input{position:absolute;opacity:0;pointer-events:none}.choice span{display:block;padding:12px 10px;border:1px solid var(--line);border-radius:11px;background:#0d1729;color:#eef3ff;text-align:center;font-weight:800;cursor:pointer;transition:.18s}.choice input:checked+span{border-color:var(--gold);background:rgba(216,177,90,.16);color:#f1cf7b;box-shadow:0 0 0 2px rgba(216,177,90,.12)}.choice span:hover{border-color:#8fa2c7}.choice-block{display:grid;gap:8px}.choice-title{font-weight:700}.choice-note{font-size:12px;color:var(--muted);font-weight:400}button:disabled{opacity:.55}#status{font-weight:800;margin-left:12px}.ok{color:#63d394}.err{color:#ff8080}.work{color:#e5c46f}@media(max-width:720px){.grid{grid-template-columns:1fr}label.full{grid-column:auto}.choices{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head><body><div class="wrap">
<div class="top"><a class="brand" href="../"><b>국제경찰무도연합회</b><span>INTERNATIONAL POLICE MARTIAL ARTS ALLIANCE</span></a><a class="home" href="../">홈으로</a></div>
<section class="hero"><small>IPMA MEMBERSHIP</small><h1>IPMA 회원가입 신청</h1><p>무도교육과 국제교류, 안전과 봉사의 가치에 함께할 회원과 지도자를 기다립니다.</p></section>
<form id="form">
<section class="box"><h2>1. 기본정보</h2><div class="grid">
<label>이름 *<input name="name" required maxlength="40"></label>
<label>나이 *<input name="age" type="number" min="1" max="120" required></label>
<label>지역·국가 *<input name="region" required maxlength="80" placeholder="예: 울산 / 대한민국"></label>
<label>핸드폰번호 *<input name="phone" type="tel" required maxlength="30"></label>
<label class="full">이메일 *<input name="email" type="email" required maxlength="120"></label>
</div></section>
<section class="box"><h2>2. 무도·활동 정보</h2><div class="grid">
<label>소속 단체·도장<input name="organization" maxlength="120"></label>
<label>주 수련 무도<input name="primary_martial_art" maxlength="100" placeholder="예: 태권도, 합기도, 검도"></label>
<label class="full">무도 경력<textarea name="martial_experience" placeholder="수련 종목과 기간 등을 간단히 적어주세요."></textarea></label>
<label>단·급 또는 자격<input name="rank_certificate" maxlength="150"></label>
<div class="choice-block"><div class="choice-title">회원 구분 *</div><div class="choices">
<label class="choice"><input type="radio" name="member_type" value="일반회원" required><span>일반회원</span></label>
<label class="choice"><input type="radio" name="member_type" value="지도자"><span>지도자</span></label>
<label class="choice"><input type="radio" name="member_type" value="관장"><span>관장</span></label>
<label class="choice"><input type="radio" name="member_type" value="임원"><span>임원</span></label>
<label class="choice"><input type="radio" name="member_type" value="지부회원"><span>지부회원</span></label>
<label class="choice"><input type="radio" name="member_type" value="기타"><span>기타</span></label>
</div></div>
<label class="full">경찰·경호·보안 관련 경력<textarea name="security_experience" placeholder="관련 경력이 없으면 비워두셔도 됩니다."></textarea></label>
<div class="choice-block"><div class="choice-title">가입 경로</div><div class="choices">
<label class="choice"><input type="radio" name="join_source" value="SNS"><span>SNS</span></label>
<label class="choice"><input type="radio" name="join_source" value="인터넷 검색"><span>인터넷 검색</span></label>
<label class="choice"><input type="radio" name="join_source" value="지인 소개"><span>지인 소개</span></label>
<label class="choice"><input type="radio" name="join_source" value="교육·세미나"><span>교육·세미나</span></label>
<label class="choice"><input type="radio" name="join_source" value="대회·행사"><span>대회·행사</span></label>
<label class="choice"><input type="radio" name="join_source" value="기타"><span>기타</span></label>
</div><div class="choice-note">해당하는 항목을 하나 선택해 주세요.</div></div>
<label>추천인<input name="referrer" maxlength="80" placeholder="없으면 비워두세요"></label>
</div></section>
<section class="box"><h2>3. 사진 및 동의</h2><div class="grid">
<label class="full">프로필 사진 *<input id="photo" type="file" accept="image/jpeg,image/png,image/webp" required><span class="note">JPG·PNG·WEBP, 최대 5MB. 회원 관리와 본인 확인에 사용합니다.</span></label>
<label class="full consent"><input type="checkbox" required><span>회원가입 심사 및 회원관리를 위한 개인정보 수집·이용에 동의합니다. *</span></label>
</div></section>
<div><button id="btn" type="submit">IPMA 회원가입 신청</button><span id="status"></span></div>
</form></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const db=supabase.createClient('https://ojxarsfaewehwjidwgac.supabase.co','sb_publishable_ZoAZrV5rDmYDLxhXlnEXCw_lPqJfin0');
const form=document.getElementById('form'),btn=document.getElementById('btn'),statusEl=document.getElementById('status');
const setStatus=(m,c='')=>{statusEl.textContent=m;statusEl.className=c};
const ext=f=>({'image/jpeg':'jpg','image/png':'png','image/webp':'webp'}[f.type]||'jpg');
form.addEventListener('submit',async e=>{
 e.preventDefault(); if(btn.disabled)return;
 const photo=document.getElementById('photo').files[0];
 if(!photo||photo.size>5*1024*1024)return setStatus('5MB 이하의 사진을 선택해 주세요.','err');
 btn.disabled=true; setStatus('신청을 접수하고 있습니다...','work'); let path=null;
 try{
  const fd=new FormData(form), id=(crypto.randomUUID?crypto.randomUUID():Math.random().toString(36).slice(2));
  path=`applications/${new Date().getFullYear()}/${Date.now()}-${id}.${ext(photo)}`;
  const {error:u}=await db.storage.from('ipma-member-photos').upload(path,photo,{upsert:false,contentType:photo.type}); if(u)throw u;
  const payload={name:String(fd.get('name')).trim(),age:Number(fd.get('age')),region:String(fd.get('region')).trim(),phone:String(fd.get('phone')).trim(),email:String(fd.get('email')).trim(),photo_url:path,organization:String(fd.get('organization')||'').trim()||null,primary_martial_art:String(fd.get('primary_martial_art')||'').trim()||null,martial_experience:String(fd.get('martial_experience')||'').trim()||null,rank_certificate:String(fd.get('rank_certificate')||'').trim()||null,security_experience:String(fd.get('security_experience')||'').trim()||null,member_type:String(fd.get('member_type')).trim(),join_source:String(fd.get('join_source')||'').trim()||null,referrer:String(fd.get('referrer')||'').trim()||null,member_number:null,status:'pending'};
  const {error:i}=await db.from('ipma_member_applications').insert(payload); if(i){await db.storage.from('ipma-member-photos').remove([path]);throw i}
  form.reset();setStatus('IPMA 회원가입 신청이 정상적으로 접수되었습니다.','ok');
 }catch(err){console.error(err);setStatus('접수 중 오류가 발생했습니다. 잠시 후 다시 시도해 주세요.','err')}finally{btn.disabled=false}
});
</script></body></html>
