<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IPMA 본부 접수관리</title><style>
:root{--bg:#061426;--panel:#0d223b;--panel2:#122c4c;--line:rgba(255,255,255,.13);--gold:#ddb34d;--text:#eef5ff;--muted:#aebbd1;--ok:#72dfa3}*{box-sizing:border-box}body{margin:0;background:linear-gradient(160deg,#061426,#091c32);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}.wrap{width:min(1180px,calc(100% - 26px));margin:auto;padding:28px 0 70px}.head,.toolbar,.app-top,.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.head,.app-top{justify-content:space-between;align-items:flex-start}.head h1{margin:0 0 7px}.lead,.meta,.date{margin:0;color:var(--muted);line-height:1.6}.btn,input,select,textarea{font:inherit;border:1px solid var(--line);border-radius:10px;background:#07182c;color:#fff;padding:10px}.btn{background:linear-gradient(135deg,var(--gold),#997127);font-weight:900;cursor:pointer}.btn.dark{background:#152f50}.panel,.app-card{background:rgba(13,34,59,.97);border:1px solid var(--line);border-radius:19px;padding:19px;margin-top:18px}.login{max-width:620px}.login input{min-width:280px}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:18px}.stat,.detail{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:14px}.stat b{display:block;font-size:24px;color:var(--gold)}.stat span,.date{font-size:12px}.list{display:grid;gap:15px;margin-top:17px}.type{color:var(--gold);font-weight:950}.person{margin-top:5px;font-size:20px;font-weight:900}.meta{font-size:13px}.details{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}.detail{background:#081a30;border-radius:12px;padding:11px}.detail b{display:block;font-size:12px;margin-bottom:5px}.detail span{font-size:13px;color:var(--muted);white-space:pre-line}.manage{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin-top:14px}.field{display:grid;gap:5px}.field label{font-size:11px;font-weight:900;color:var(--gold)}.field input,.field select,.field textarea{width:100%;min-width:0}.wide{grid-column:span 2}.actions{justify-content:flex-end;margin-top:13px}.saved{font-size:13px;color:var(--ok);font-weight:900}.empty{text-align:center;color:var(--muted)}@media(max-width:820px){.summary{grid-template-columns:1fr 1fr}.details,.manage{grid-template-columns:1fr 1fr}.wide{grid-column:span 2}}@media(max-width:520px){.summary,.details,.manage{grid-template-columns:1fr}.wide{grid-column:span 1}.login input{min-width:0;width:100%}.toolbar{width:100%}.app-card{padding:14px}}
</style></head><body><main class="wrap"><header class="head"><div><h1>IPMA 본부 통합 접수관리</h1><p class="lead">신청·결제·검토·검정·자격증 및 단증 발급을 한 화면에서 관리합니다.</p></div><div id="adminTools" class="toolbar" hidden><button id="refresh" class="btn dark">새로고침</button><button id="logout" class="btn dark">로그아웃</button></div></header><section id="login" class="panel login"><h2>본부 관리자 이메일 로그인</h2><p class="lead">비밀번호 없이 지메일로 받은 일회용 링크를 눌러 로그인합니다.</p><div class="toolbar" style="margin-top:14px"><input id="email" type="email" value="jeonseongkweon@gmail.com"><button id="loginBtn" class="btn">로그인 링크 받기</button></div><p id="loginMsg"></p></section><section id="app" hidden><div class="summary"><div class="stat"><b id="allCount">0</b><span>전체 신청</span></div><div class="stat"><b id="payCount">0</b><span>입금대기</span></div><div class="stat"><b id="reviewCount">0</b><span>검토·심사중</span></div><div class="stat"><b id="issueCount">0</b><span>발급·배송중</span></div></div><div id="list" class="list"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=supabase.createClient('https://ojxarsfaewehwjidwgac.supabase.co','sb_publishable_ZoAZrV5rDmYDLxhXlnEXCw_lPqJfin0'),ADMIN='jeonseongkweon@gmail.com';const L={ipma:'경찰무도',taegeom:'태권검도',idp:'드론순찰대',instructor_course:'지도자 교육과정',instructor_exam:'지도자 검정·자격증',certified_dojang:'공식 인증도장',student_exam:'학생 심사·단증',waiting:'입금대기',confirmed:'입금확인',refunded:'환불',waived:'비용면제',received:'접수완료',reviewing:'검토중',approved:'승인',rejected:'반려',hold:'보류',not_required:'해당없음',scheduled:'심사예정',passed:'합격',failed:'불합격',not_ready:'발급준비 전',ready:'발급준비',issued:'발급완료',shipped:'배송중',completed:'처리완료'};const choices=(v,a)=>a.map(x=>`<option value="${x}" ${v===x?'selected':''}>${L[x]||x}</option>`).join('');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load(){const [{data,error},{data:catalog}]=await Promise.all([db.from('ipma_service_applications').select('*').order('created_at',{ascending:false}),db.from('ipma_products').select('product_code,product_name')]);if(error){alert(error.message);return}const names=Object.fromEntries((catalog||[]).map(p=>[p.product_code,p.product_name]));allCount.textContent=data.length;payCount.textContent=data.filter(x=>x.payment_status==='waiting').length;reviewCount.textContent=data.filter(x=>['received','reviewing','hold'].includes(x.review_status)).length;issueCount.textContent=data.filter(x=>['ready','issued','shipped'].includes(x.issuance_status)).length;if(!data.length){list.innerHTML='<div class="panel empty">접수된 신청이 없습니다.</div>';return}list.innerHTML=data.map(r=>`<article class="app-card" data-id="${r.id}"><div class="app-top"><div><div class="type">${esc(names[r.product_code]||L[r.application_type]||r.application_type)}</div><div class="person">${esc(r.applicant_name)}</div><div class="meta">${esc(r.phone)} · ${esc(r.email)}</div></div><div class="date">접수 ${new Date(r.created_at).toLocaleString('ko-KR')}</div></div><div class="details"><div class="detail"><b>종목·소속·과정</b><span>${esc(L[r.service_brand]||L[r.application_type]||'-')}\n${esc(r.organization||'-')}\n${esc(r.program_name||'-')}</span></div><div class="detail"><b>학생·급단·지도자</b><span>${esc(r.student_name||'-')}\n${esc(r.current_rank||'-')} → ${esc(r.requested_rank||'-')}\n${esc(r.instructor_name||'-')}</span></div><div class="detail"><b>입금자·주소·문의</b><span>${esc(r.depositor_name||'-')}\n${esc(r.shipping_address||'-')}\n${esc(r.notes||'-')}</span></div></div><div class="manage"><div class="field"><label>안내금액</label><input data-k="fee_amount" type="number" min="0" value="${r.fee_amount||0}"></div><div class="field"><label>결제</label><select data-k="payment_status">${choices(r.payment_status,['waiting','confirmed','refunded','waived'])}</select></div><div class="field"><label>검토</label><select data-k="review_status">${choices(r.review_status,['received','reviewing','approved','rejected','hold'])}</select></div><div class="field"><label>검정</label><select data-k="exam_status">${choices(r.exam_status,['not_required','waiting','scheduled','passed','failed'])}</select></div><div class="field"><label>발급·배송</label><select data-k="issuance_status">${choices(r.issuance_status,['not_ready','ready','issued','shipped','completed'])}</select></div><div class="field wide"><label>자격증·단증번호</label><input data-k="certificate_number" value="${esc(r.certificate_number||'')}"></div><div class="field wide"><label>본부 메모</label><textarea data-k="admin_memo">${esc(r.admin_memo||'')}</textarea></div></div><div class="actions"><span class="saved"></span><button class="btn save">변경사항 저장</button></div></article>`).join('');document.querySelectorAll('.save').forEach(b=>b.onclick=()=>save(b.closest('.app-card')))}
async function save(card){const p={};card.querySelectorAll('[data-k]').forEach(x=>p[x.dataset.k]=x.dataset.k==='fee_amount'?Number(x.value||0):(x.value||null));const note=card.querySelector('.saved');note.textContent='저장 중...';const {error}=await db.from('ipma_service_applications').update(p).eq('id',card.dataset.id);if(error){note.textContent='저장 실패';alert(error.message);return}note.textContent='저장되었습니다';setTimeout(()=>note.textContent='',2500);load()}
async function authUI(){const {data}=await db.auth.getSession(),s=data.session,ok=!!s&&String(s.user.email||'').toLowerCase()===ADMIN;login.hidden=ok;app.hidden=!ok;adminTools.hidden=!ok;if(s&&!ok){loginMsg.innerHTML='현재 계정에는 본부 권한이 없습니다. <button id="switch" class="btn dark">계정 전환</button>';document.getElementById('switch').onclick=async()=>{await db.auth.signOut();location.reload()}}if(ok)load()}loginBtn.onclick=async()=>{const mail=email.value.trim().toLowerCase();if(mail!==ADMIN){loginMsg.textContent='본부 관리자 지메일을 입력해 주세요.';return}loginBtn.disabled=true;loginMsg.textContent='로그인 링크를 보내는 중...';const {error}=await db.auth.signInWithOtp({email:mail,options:{emailRedirectTo:location.href,shouldCreateUser:false}});loginMsg.textContent=error?'발송 실패: '+error.message:'지메일로 일회용 로그인 링크를 보냈습니다.';if(error)loginBtn.disabled=false};logout.onclick=async()=>{await db.auth.signOut();location.reload()};refresh.onclick=load;db.auth.onAuthStateChange(()=>setTimeout(authUI,0));authUI();
</script></body></html>
