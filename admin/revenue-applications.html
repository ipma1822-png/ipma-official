<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IPMA 본부 접수관리</title><style>
:root{--bg:#071426;--panel:#10223b;--line:rgba(255,255,255,.13);--gold:#d8b15a;--text:#eef4ff;--muted:#aebbd1;--ok:#70dfa1;--bad:#ff9494}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}.wrap{width:min(1500px,calc(100% - 24px));margin:auto;padding:24px 0 60px}h1{margin:0 0 8px}.lead{color:var(--muted)}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;margin-top:16px}.login{max-width:620px}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}input,select,textarea,button{font:inherit;border:1px solid var(--line);border-radius:9px;background:#07162a;color:#fff;padding:9px}button{background:linear-gradient(135deg,var(--gold),#9c7529);font-weight:900;cursor:pointer}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;min-width:1500px}th,td{border-bottom:1px solid var(--line);padding:10px 8px;vertical-align:top;text-align:left;font-size:12px}th{color:var(--gold)}td input,td select,td textarea{width:100%;min-width:105px}td textarea{min-height:64px}.muted{color:var(--muted)}.ok{color:var(--ok)}.bad{color:var(--bad)}</style></head><body><main class="wrap"><h1>IPMA 본부 통합 접수관리</h1><p class="lead">지도자교육·검정·인증도장·학생심사 신청의 결제, 승인, 검정, 발급 및 배송 상태를 관리합니다.</p><section id="login" class="card login"><h2>본부 관리자 이메일 로그인</h2><p class="lead">비밀번호 없이 지메일로 받은 일회용 링크를 눌러 로그인합니다.</p><div class="row"><input id="email" type="email" value="jeonseongkweon@gmail.com" placeholder="관리자 이메일"><button id="loginBtn">로그인 링크 받기</button></div><p id="loginMsg"></p></section><section id="app" class="card" hidden><div class="row"><button id="refresh">새로고침</button><button id="logout">로그아웃</button><span id="count" class="muted"></span></div><div class="scroll"><table><thead><tr><th>접수일·유형</th><th>신청자</th><th>소속·과정</th><th>학생·급단</th><th>주소·내용</th><th>금액</th><th>결제</th><th>검토</th><th>검정</th><th>발급</th><th>발급번호</th><th>본부 메모</th><th>저장</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=supabase.createClient('https://ojxarsfaewehwjidwgac.supabase.co','sb_publishable_ZoAZrV5rDmYDLxhXlnEXCw_lPqJfin0'),ADMINS=['jeonseongkweon@gmail.com'];const labels={instructor_course:'지도자교육',instructor_exam:'지도자검정',certified_dojang:'인증도장',student_exam:'학생심사'};const opts=(v,a)=>a.map(x=>`<option value="${x}" ${v===x?'selected':''}>${x}</option>`).join('');
async function load(){const {data,error}=await db.from('ipma_service_applications').select('*').order('created_at',{ascending:false});if(error){alert(error.message);return}count.textContent=`총 ${data.length}건`;rows.innerHTML=data.map(r=>`<tr data-id="${r.id}"><td>${new Date(r.created_at).toLocaleDateString('ko-KR')}<br><b>${labels[r.application_type]||r.application_type}</b></td><td><b>${r.applicant_name||''}</b><br>${r.phone||''}<br><span class="muted">${r.email||''}</span></td><td>${r.organization||''}<br>${r.program_name||''}</td><td>${r.student_name||''}<br>${r.current_rank||''} → ${r.requested_rank||''}<br>${r.instructor_name||''}</td><td>${r.shipping_address||''}<br><span class="muted">${r.notes||''}</span></td><td><input data-k="fee_amount" type="number" min="0" value="${r.fee_amount||0}"></td><td><select data-k="payment_status">${opts(r.payment_status,['waiting','confirmed','refunded','waived'])}</select></td><td><select data-k="review_status">${opts(r.review_status,['received','reviewing','approved','rejected','hold'])}</select></td><td><select data-k="exam_status">${opts(r.exam_status,['not_required','waiting','scheduled','passed','failed'])}</select></td><td><select data-k="issuance_status">${opts(r.issuance_status,['not_ready','ready','issued','shipped','completed'])}</select></td><td><input data-k="certificate_number" value="${r.certificate_number||''}"></td><td><textarea data-k="admin_memo">${r.admin_memo||''}</textarea></td><td><button class="save">저장</button></td></tr>`).join('');document.querySelectorAll('.save').forEach(b=>b.onclick=()=>save(b.closest('tr')))}
async function save(tr){const p={};tr.querySelectorAll('[data-k]').forEach(x=>p[x.dataset.k]=x.dataset.k==='fee_amount'?Number(x.value||0):(x.value||null));const {error}=await db.from('ipma_service_applications').update(p).eq('id',tr.dataset.id);if(error){alert(error.message);return}alert('저장되었습니다.')}
async function authUI(){const {data}=await db.auth.getSession();const s=data.session,ok=!!s&&ADMINS.includes(String(s.user.email||'').toLowerCase());login.hidden=ok;app.hidden=!ok;if(s&&!ok){loginMsg.innerHTML='현재 로그인된 <b>'+String(s.user.email||'')+'</b> 계정에는 본부 관리자 권한이 없습니다.<br><button id="switchAccount" type="button">다른 계정으로 로그인</button>';document.getElementById('switchAccount').onclick=async()=>{await db.auth.signOut();location.reload()}}if(ok)load()}
loginBtn.onclick=async()=>{const mail=email.value.trim().toLowerCase();if(!ADMINS.includes(mail)){loginMsg.textContent='등록된 본부 관리자 지메일을 입력해 주세요.';return}loginBtn.disabled=true;loginMsg.textContent='로그인 링크를 보내는 중...';const {error}=await db.auth.signInWithOtp({email:mail,options:{emailRedirectTo:location.href,shouldCreateUser:false}});loginMsg.textContent=error?'링크를 보내지 못했습니다: '+error.message:'지메일을 확인해 주세요. 일회용 로그인 링크를 보냈습니다.';if(error)loginBtn.disabled=false};logout.onclick=async()=>{await db.auth.signOut();authUI()};refresh.onclick=load;db.auth.onAuthStateChange(()=>setTimeout(authUI,0));authUI();
</script></body></html>
