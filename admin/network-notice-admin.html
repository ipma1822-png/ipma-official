<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>통합공지 발행센터 | IPMA</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,'Noto Sans KR',sans-serif;background:#eef2f6;color:#172033}.wrap{width:min(980px,calc(100% - 28px));margin:34px auto}.top{background:#0b2748;color:white;border-radius:20px;padding:24px}.top small{color:#e5bd61;font-weight:900;letter-spacing:.12em}.top h1{margin:7px 0 4px}.panel{background:white;border:1px solid #dce3eb;border-radius:18px;padding:22px;margin-top:16px;box-shadow:0 8px 24px #1934510d}label{display:grid;gap:7px;font-weight:800;margin:14px 0}input,textarea,select{width:100%;padding:12px;border:1px solid #cfd8e3;border-radius:10px;font:inherit}textarea{min-height:220px;resize:vertical}.checks{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}.check{border:1px solid #d8e0e8;border-radius:12px;padding:12px;background:#f8fafc}.check input{width:auto}button{border:0;border-radius:11px;padding:13px 18px;font-weight:900;cursor:pointer}.primary{background:#0b2748;color:#fff}.gold{background:#c99a3d;color:white}.row{display:flex;gap:8px;flex-wrap:wrap}#msg{margin-top:12px;font-weight:800}.posts{display:grid;gap:8px}.post{border:1px solid #e0e6ed;border-radius:12px;padding:13px}.post b{display:block}.post small{color:#788697}@media(max-width:700px){.checks{grid-template-columns:1fr 1fr}}</style></head><body><div class="wrap"><section class="top"><small>GLOBAL NETWORK MESSAGE CENTER · v1.0</small><h1>통합공지 발행센터</h1><p>한 번 작성하고 태권검도 · 경찰무도 · 드론순찰대 · ACTS에 선택 배포합니다. Global News24는 제외됩니다.</p></section><section class="panel" id="login"><h2>관리자 인증</h2><p>등록된 관리자 계정으로 이메일 인증 후 발행할 수 있습니다.</p><div class="row"><input id="email" type="email" placeholder="관리자 이메일" style="flex:1"><button class="primary" id="loginBtn">로그인 링크 받기</button></div><div id="loginMsg"></div></section><section class="panel" id="editor" hidden><label>제목<input id="title" maxlength="180" placeholder="예: 세계 네트워크 회원 여러분께 드리는 메시지"></label><label>분류<select id="category"><option>총재 메시지</option><option>공지</option><option>교육</option><option>행사</option><option>회원모집</option><option>지부모집</option><option>긴급공지</option></select></label><label>발행 대상</label><div class="checks"><label class="check"><span><input type="checkbox" id="all"> 전체 네트워크</span></label><label class="check"><span><input type="checkbox" value="WTKF" class="target"> 태권검도</span></label><label class="check"><span><input type="checkbox" value="IPMA" class="target"> 경찰무도</span></label><label class="check"><span><input type="checkbox" value="IDP" class="target"> 드론순찰대</span></label><label class="check"><span><input type="checkbox" value="ACTS" class="target"> ACTS</span></label></div><label>내용<textarea id="content" placeholder="메시지를 입력하세요"></textarea></label><div class="row"><label style="margin:0"><span><input type="checkbox" id="pin" style="width:auto"> 중요공지 상단고정</span></label><label style="margin:0">노출 종료일(선택)<input id="expires" type="date"></label></div><details><summary>언어별 번역문 입력 (선택)</summary><p>직접 입력한 번역문만 저장합니다. 자동번역 기능이 아닙니다. 비어 있는 항목은 한국어 원문으로 표시됩니다.</p><label>번역 언어<select id="translationLanguage"><option value="ko">한국어</option><option value="en">English</option><option value="zh">中文</option><option value="ja">日本語</option><option value="es">Español</option><option value="fr">Français</option><option value="de">Deutsch</option><option value="pt">Português</option><option value="it">Italiano</option><option value="ru">Русский</option><option value="mn">Монгол</option><option value="vi">Tiếng Việt</option><option value="th">ไทย</option><option value="id">Bahasa Indonesia</option><option value="ms">Bahasa Melayu</option><option value="fil">Filipino</option><option value="hi">हिन्दी</option><option value="ar">العربية</option><option value="tr">Türkçe</option><option value="ne">नेपाली</option></select></label><label>번역 제목<input id="translationTitle" maxlength="180"></label><label>번역 분류<input id="translationCategory"></label><label>번역 본문<textarea id="translationContent"></textarea></label></details><div class="row" style="margin-top:18px"><button class="gold" id="publish">선택 대상에 발행</button><button id="logout">로그아웃</button></div><div id="msg"></div></section><section class="panel" id="recent" hidden><h2>최근 통합공지</h2><div class="posts" id="posts"></div></section></div><script>const U='https://ojxarsfaewehwjidwgac.supabase.co',K='sb_publishable_ZoAZrV5rDmYDLxhXlnEXCw_lPqJfin0',ADMIN='jeonseongkweon@gmail.com',db=supabase.createClient(U,K,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,flowType:'pkce'}});const $=s=>document.querySelector(s);let authCheck=0;
let noticeTranslations={};
const translationCodes=["ko","en","zh","ja","es","fr","de","pt","it","ru","mn","vi","th","id","ms","fil","hi","ar","tr","ne"];
let translationCode='ko';
function saveTranslationInput(){
 const entry={title:$('#translationTitle').value.trim(),content:$('#translationContent').value.trim(),category:$('#translationCategory').value.trim()};
 if(Object.values(entry).some(Boolean))noticeTranslations[translationCode]=entry;else delete noticeTranslations[translationCode];
}
function showTranslationInput(){
 const entry=noticeTranslations[translationCode]||{};
 $('#translationTitle').value=entry.title||'';$('#translationContent').value=entry.content||'';$('#translationCategory').value=entry.category||'';
}
function translationPayload(){saveTranslationInput();return Object.fromEntries(translationCodes.filter(code=>noticeTranslations[code]).map(code=>[code,{...noticeTranslations[code]}]));}
$('#translationLanguage').onchange=()=>{saveTranslationInput();translationCode=$('#translationLanguage').value;showTranslationInput();};

function lock(){ $('#login').hidden=false;$('#editor').hidden=true;$('#recent').hidden=true; }
async function state(){
 const check=++authCheck;lock();
 try{
  const {data:sessionData,error:sessionError}=await db.auth.getSession();
  if(sessionError||!sessionData.session)return false;
  const {data:userData,error:userError}=await db.auth.getUser();
  if(userError||!userData.user)return false;
  const {data:context,error:contextError}=await db.rpc('gms_get_my_admin_context');
  const ok=!contextError&&context?.is_admin===true&&String(context.email||'').toLowerCase()===ADMIN&&String(userData.user.email||'').toLowerCase()===ADMIN;
  if(check!==authCheck)return false;
  if(!ok){$('#loginMsg').textContent='관리자 권한을 확인할 수 없습니다.';return false;}
  $('#login').hidden=true;$('#editor').hidden=false;$('#recent').hidden=false;
  await load();return check===authCheck;
 }catch(e){if(check===authCheck){lock();$('#loginMsg').textContent='로그인 상태를 확인할 수 없습니다. 다시 인증해 주세요.';}return false;}
}
$('#loginBtn').onclick=async()=>{const e=$('#email').value.trim().toLowerCase();if(e!==ADMIN){$('#loginMsg').textContent='등록된 총괄 관리자 이메일과 일치하지 않습니다.';return}const redirect=location.origin+'/admin/network-notice-admin.html';const{error}=await db.auth.signInWithOtp({email:e,options:{emailRedirectTo:redirect,shouldCreateUser:false}});$('#loginMsg').textContent=error?error.message:'인증 메일을 보냈습니다.'};$('#all').onchange=e=>document.querySelectorAll('.target').forEach(x=>{x.checked=e.target.checked;x.disabled=e.target.checked});$('#publish').onclick=async()=>{if(!await state())return;let targets=$('#all').checked?['ALL']:[...document.querySelectorAll('.target:checked')].map(x=>x.value);if(!targets.length)return $('#msg').textContent='발행 대상을 하나 이상 선택하세요.';if(!$('#title').value.trim()||!$('#content').value.trim())return $('#msg').textContent='제목과 내용을 입력하세요.';const expires=$('#expires').value?new Date($('#expires').value+'T23:59:59').toISOString():null;const{error}=await db.from('network_notices').insert({title:$('#title').value.trim(),content:$('#content').value.trim(),author:'전성권 총재',category:$('#category').value,targets,translations:translationPayload(),is_pinned:$('#pin').checked,is_published:true,published_at:new Date().toISOString(),expires_at:expires});$('#msg').textContent=error?('발행 실패: '+error.message):'✅ 통합공지가 발행되었습니다.';if(!error){$('#title').value='';$('#content').value='';noticeTranslations={};showTranslationInput();load()}};async function load(){const{data,error}=await db.from('network_notices').select('id,title,category,targets,published_at,is_pinned').order('published_at',{ascending:false}).limit(15);$('#posts').innerHTML=error?error.message:(data||[]).map(x=>`<div class="post"><b>${x.is_pinned?'📌 ':''}${x.title}</b><small>${x.category} · ${(x.targets||[]).join(', ')} · ${new Date(x.published_at).toLocaleString('ko-KR')}</small></div>`).join('')}$('#logout').onclick=async()=>{await db.auth.signOut();location.reload()};db.auth.onAuthStateChange(()=>{++authCheck;lock();setTimeout(()=>{state();},0);});state();</script></body></html>
