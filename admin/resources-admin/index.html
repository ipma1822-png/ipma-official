<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IPMA 자료실 관리자</title>
<style>
:root{--bg:#071426;--panel:#0d1d33;--line:rgba(255,255,255,.12);--gold:#d8b15a;--text:#eef4ff;--muted:#aebbd1;--ok:#68dc9a;--bad:#ff8b8b}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#061221,#0a1930);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}.wrap{width:min(1050px,calc(100% - 28px));margin:auto;padding:28px 0 70px}.top{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.top a{color:#fff;text-decoration:none;border:1px solid var(--line);padding:9px 12px;border-radius:10px}.card{margin-top:16px;background:rgba(13,29,51,.96);border:1px solid var(--line);border-radius:20px;padding:22px}.eyebrow{color:var(--gold);font-size:12px;font-weight:900}h1{margin:5px 0 7px}p{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.full{grid-column:1/-1}.field{display:grid;gap:6px}.field label{font-size:13px;font-weight:800}.field input,.field select,.field textarea{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:#08162a;color:#fff;font:inherit}.field textarea{min-height:90px}.btn{border:0;border-radius:10px;padding:12px 16px;background:linear-gradient(135deg,var(--gold),#987328);color:#111;font-weight:900;cursor:pointer}.btn.secondary{background:#172942;color:#fff;border:1px solid var(--line)}.status{margin-top:12px;white-space:pre-wrap;color:var(--muted)}.ok{color:var(--ok)}.bad{color:var(--bad)}.list{display:grid;gap:9px}.item{display:flex;justify-content:space-between;gap:12px;border:1px solid var(--line);border-radius:13px;padding:12px;background:#08162a}.item small{color:var(--muted)}@media(max-width:650px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.item{display:block}.item .btn{margin-top:8px}}
</style></head><body><div class="wrap"><div class="top"><b>IPMA · LEVEL RESOURCE ADMIN <span style="color:var(--gold)">v1.0</span></b><div><a href="../../resources/">자료실 보기</a> <a href="../../gms-admin/">GMS 관리자</a></div></div>
<section class="card"><div class="eyebrow">PRIVATE STORAGE · LEVEL 1–9</div><h1>자료 등록</h1><p>JPG · PNG · PDF · AI · PSD · SVG · ZIP 등 원본 파일을 비공개 Storage에 저장하고 최소 열람 LEVEL을 지정합니다. 파일당 100MB까지를 1차 기준으로 설정했습니다.</p>
<div id="loginBox"><button id="loginBtn" class="btn">관리자 Google 로그인</button><div id="loginMsg" class="status"></div></div>
<form id="form" hidden><div class="grid"><div class="field"><label>자료명 *</label><input name="title" required></div><div class="field"><label>분류 *</label><select name="category"><option>로고·CI</option><option>공식서식</option><option>교육자료</option><option>지도자자료</option><option>지부·임원자료</option><option>홍보자료</option><option>기타</option></select></div><div class="field"><label>최소 LEVEL *</label><select name="min_level"><option value="1">LEVEL 1</option><option value="2">LEVEL 2</option><option value="3">LEVEL 3</option><option value="4">LEVEL 4</option><option value="5">LEVEL 5</option><option value="6">LEVEL 6</option><option value="7">LEVEL 7</option><option value="8">LEVEL 8</option><option value="9">LEVEL 9</option></select></div><div class="field"><label>버전</label><input name="version" placeholder="예: 2026.08 / v1.0"></div><div class="field full"><label>설명</label><textarea name="description"></textarea></div><div class="field full"><label>태그 (쉼표 구분)</label><input name="tags" placeholder="예: IPMA, 로고, 공식원본"></div><div class="field full"><label>파일 *</label><input name="file" type="file" required></div></div><div style="margin-top:14px"><button class="btn" type="submit">비공개 자료 등록</button> <button class="btn secondary" type="button" id="logoutBtn">로그아웃</button></div><div id="msg" class="status"></div></form></section>
<section class="card"><h2>등록 자료</h2><div id="list" class="list"><p>관리자 로그인 후 표시됩니다.</p></div></section></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const URL='https://ojxarsfaewehwjidwgac.supabase.co',KEY='sb_publishable_ZoAZrV5rDmYDLxhXlnEXCw_lPqJfin0',ADMINS=['jeonseongkweon@gmail.com','ipma1822@gmail.com'];
const db=supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,flowType:'pkce'}});const form=document.getElementById('form'),loginBox=document.getElementById('loginBox'),msg=document.getElementById('msg'),list=document.getElementById('list');
const admin=u=>ADMINS.includes(String(u?.email||'').toLowerCase());const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
async function boot(){const {data:{session}}=await db.auth.getSession();if(!session||!admin(session.user)){loginBox.hidden=false;form.hidden=true;return}loginBox.hidden=true;form.hidden=false;await load()}
document.getElementById('loginBtn').onclick=async()=>{const redir=new URL(location.href);redir.search='';redir.hash='';const {error}=await db.auth.signInWithOAuth({provider:'google',options:{redirectTo:redir.href}});if(error)document.getElementById('loginMsg').textContent=error.message};
document.getElementById('logoutBtn').onclick=async()=>{await db.auth.signOut();location.reload()};
function safeName(n){return String(n||'file').normalize('NFKD').replace(/[^a-zA-Z0-9._-]+/g,'-').replace(/-+/g,'-').slice(-120)}
form.onsubmit=async e=>{e.preventDefault();msg.className='status';msg.textContent='파일을 안전하게 업로드하는 중입니다...';const fd=new FormData(form),f=fd.get('file');if(!f||!f.name)return;const ext=(f.name.split('.').pop()||'FILE').toUpperCase(),path=`${new Date().getFullYear()}/${crypto.randomUUID()}-${safeName(f.name)}`;const up=await db.storage.from('ipma-private-resources').upload(path,f,{contentType:f.type||'application/octet-stream',upsert:false});if(up.error){msg.className='status bad';msg.textContent='Storage 업로드 실패: '+up.error.message;return}const tags=String(fd.get('tags')||'').split(',').map(x=>x.trim()).filter(Boolean);const {data:{user}}=await db.auth.getUser();const ins=await db.from('ipma_resources').insert({title:String(fd.get('title')).trim(),category:String(fd.get('category')),min_level:Number(fd.get('min_level')),description:String(fd.get('description')||'').trim()||null,version:String(fd.get('version')||'').trim()||null,tags,storage_path:path,file_name:f.name,file_type:ext,mime_type:f.type||null,file_size:f.size,created_by:user?.id||null}).select().single();if(ins.error){await db.storage.from('ipma-private-resources').remove([path]);msg.className='status bad';msg.textContent='자료정보 등록 실패: '+ins.error.message;return}msg.className='status ok';msg.textContent='등록 완료! 회원 LEVEL에 따라 즉시 자료실에서 제어됩니다.';form.reset();await load()};
async function load(){const {data,error}=await db.from('ipma_resources').select('*').order('created_at',{ascending:false});if(error){list.innerHTML=`<p class="bad">${esc(error.message)}</p>`;return}list.innerHTML=(data||[]).map(r=>`<div class="item"><div><b>${esc(r.title)}</b><br><small>${esc(r.category)} · LEVEL ${r.min_level}+ · ${esc(r.file_type||'FILE')} · ${esc(r.file_name||'')}</small></div><button class="btn secondary" onclick="removeOne('${r.id}','${encodeURIComponent(r.storage_path)}')">삭제</button></div>`).join('')||'<p>등록된 자료가 없습니다.</p>'}
window.removeOne=async(id,p)=>{if(!confirm('이 자료와 원본 파일을 삭제할까요?'))return;const path=decodeURIComponent(p);const a=await db.storage.from('ipma-private-resources').remove([path]);if(a.error){alert(a.error.message);return}const b=await db.from('ipma_resources').delete().eq('id',id);if(b.error){alert(b.error.message);return}await load()};
db.auth.onAuthStateChange(()=>setTimeout(boot,150));boot();
</script></body></html>
